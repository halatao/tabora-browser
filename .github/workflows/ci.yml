name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: ./scripts/install-host.ps1
      - run: npx playwright install chromium
      - run: npm run test:native
      - run: npm run test:managed
      - run: npm run test:mcp
      - run: npm run test:mcp-legacy
      - run: npm run test:browser
      - run: npm run test:sdk
